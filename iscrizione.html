<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Iscrizione Online Società & Atleti - Torneo Karate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SDK Firebase per la sincronizzazione in tempo reale -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 1px solid #dee2e6; display: none; }
        .preview-locandina { max-height: 150px; object-fit: contain; border-radius: 8px; border: 1px solid #dee2e6; display: none; margin-top: 10px; }
    </style>
</head>
<body class="bg-light py-5" onload="inizializzaIscrizioneOnline()">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">🥋 Portale Iscrizione Società & Atleti</h2>
                        <p class="text-muted">Compila il modulo per registrare la tua società e i tuoi atleti all'evento ufficiale.</p>
                    </div>

                    <div id="messaggioStato"></div>

                    <!-- DATI DELL'EVENTO (Sincronizzati in automatico) -->
                    <div class="card p-3 mb-4 bg-white shadow-sm border-primary">
                        <h5 class="fw-bold text-primary mb-3">🏆 Evento Ufficiale</h5>
                        <div class="row g-3 align-items-center">
                            <div class="col-md-7">
                                <label class="form-label fw-bold">Nome Evento Attuale</label>
                                <input type="text" id="regNomeEvento" class="form-control fw-bold fs-5 text-success bg-light" readonly>
                            </div>
                            <div class="col-md-5 text-center">
                                <img id="locandinaPreview" class="preview-locandina mx-auto">
                            </div>
                        </div>
                    </div>

                    <!-- DATI DELLA SOCIETÀ -->
                    <div class="card p-3 mb-4 bg-white shadow-sm">
                        <h5 class="fw-bold text-dark mb-3">🏢 Dati Società, Tecnico & Immagini</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nome Società</label>
                                <input type="text" id="regNomeSocieta" class="form-control" placeholder="Es. Asd Karate Club Palermo" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nome Tecnico / Referente</label>
                                <input type="text" id="regNomeTecnico" class="form-control" placeholder="Es. Sensei Mario Rossi" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" id="regEmailSocieta" class="form-control" placeholder="email@societa.it">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Telefono</label>
                                <input type="text" id="regTelSocieta" class="form-control" placeholder="3331234567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Logo Società</label>
                                <div class="input-group">
                                    <input type="file" id="regLogoFile" class="form-control" accept="image/*" onchange="convertiImmagine(this, 'logoPreview')">
                                    <img id="logoPreview" class="preview-img ms-2">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Foto Tecnico / Maestro</label>
                                <div class="input-group">
                                    <input type="file" id="regFotoTecnicoFile" class="form-control" accept="image/*" onchange="convertiImmagine(this, 'fotoTecnicoPreview')">
                                    <img id="fotoTecnicoPreview" class="preview-img ms-2">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ELENCO ATLETI DA AGGIUNGERE -->
                    <div class="card p-3 mb-4 bg-white shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-dark mb-0">👥 Elenco Atleti della Società</h5>
                            <button type="button" class="btn btn-sm btn-outline-primary fw-bold" onclick="aggiungiRigaAtletaForm()">➕ Aggiungi Atleta</button>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle" id="tabellaAtletiForm">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nome</th>
                                        <th>Cognome</th>
                                        <th>Data Nascita</th>
                                        <th>Sesso</th>
                                        <th>Cintura</th>
                                        <th>Specialità</th>
                                        <th>Peso (Kg)</th>
                                        <th style="width: 50px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="righeAtletiBody">
                                    <!-- Le righe verranno aggiunte dinamicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <button class="btn btn-success w-100 py-3 fw-bold fs-5" onclick="inviaIscrizioneAlTorneo()">🚀 Invia Iscrizione Definitiva</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://yoshukan-cup-2027-1a-giornata-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let logoBase64Temp = "";
        let fotoTecnicoBase64Temp = "";
        let locandinaEventoRemota = "";

        function inizializzaIscrizioneOnline() {
            aggiungiRigaAtletaForm();
            
            // Prende in tempo reale il nome dell'evento e la locandina impostati dal gestore
            database.ref('dettagli_evento').on('value', (snapshot) => {
                let ev = snapshot.val();
                if (ev && ev.nomeEvento) {
                    document.getElementById('regNomeEvento').value = ev.nomeEvento;
                } else {
                    document.getElementById('regNomeEvento').value = "Coppa Natale 2026";
                }
                if (ev && ev.locandina) {
                    locandinaEventoRemota = ev.locandina;
                    let imgP = document.getElementById('locandinaPreview');
                    imgP.src = ev.locandina;
                    imgP.style.display = 'block';
                }
            });
        }

        function convertiImmagine(input, previewId) {
            let file = input.files[0];
            if (!file) return;
            
            if (file.size > 1024 * 1024 * 1.5) {
                alert("L'immagine è troppo grande! Seleziona un'immagine inferiore a 1.5 MB.");
                input.value = "";
                return;
            }

            let reader = new FileReader();
            reader.onload = function(e) {
                let base64String = e.target.result;
                let imgPreview = document.getElementById(previewId);
                imgPreview.src = base64String;
                imgPreview.style.display = 'inline-block';

                if (previewId === 'logoPreview') logoBase64Temp = base64String;
                if (previewId === 'fotoTecnicoPreview') fotoTecnicoBase64Temp = base64String;
            };
            reader.readAsDataURL(file);
        }

        function aggiungiRigaAtletaForm() {
            let tbody = document.getElementById('righeAtletiBody');
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="form-control form-control-sm atl-nome" placeholder="Nome"></td>
                <td><input type="text" class="form-control form-control-sm atl-cognome" placeholder="Cognome"></td>
                <td><input type="date" class="form-control form-control-sm atl-nascita"></td>
                <td>
                    <select class="form-select form-select-sm atl-sesso">
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>
                </td>
                <td>
                    <select class="form-select form-select-sm atl-cintura">
                        <option value="Bianca">Bianca</option>
                        <option value="Gialla">Gialla</option>
                        <option value="Arancione">Arancione</option>
                        <option value="Verde">Verde</option>
                        <option value="Blu">Blu</option>
                        <option value="Marrone">Marrone</option>
                        <option value="Nera">Nera</option>
                    </select>
                </td>
                <td>
                    <select class="form-select form-select-sm atl-specialita">
                        <option value="Kata">Kata</option>
                        <option value="Kumite">Kumite</option>
                        <option value="Entrambi">Entrambi</option>
                    </select>
                </td>
                <td><input type="number" step="0.1" class="form-control form-control-sm atl-peso" placeholder="Kg"></td>
                <td class="text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function inviaIscrizioneAlTorneo() {
            let nomeEvento = document.getElementById('regNomeEvento').value.trim();
            let nomeSoc = document.getElementById('regNomeSocieta').value.trim();
            let nomeTec = document.getElementById('regNomeTecnico').value.trim();
            let emailSoc = document.getElementById('regEmailSocieta').value.trim();
            let telSoc = document.getElementById('regTelSocieta').value.trim();

            if (!nomeSoc || !nomeTec) {
                alert("Inserisci il Nome Società e il Nome del Tecnico!");
                return;
            }

            let righe = document.querySelectorAll('#righeAtletiBody tr');
            let nuoviAtleti = [];

            righe.forEach(r => {
                let nome = r.querySelector('.atl-nome').value.trim();
                let cognome = r.querySelector('.atl-cognome').value.trim();
                let dataNascita = r.querySelector('.atl-nascita').value;
                let sesso = r.querySelector('.atl-sesso').value;
                let cintura = r.querySelector('.atl-cintura').value;
                let specialita = r.querySelector('.atl-specialita').value;
                let peso = parseFloat(r.querySelector('.atl-peso').value) || 0;

                if (nome && cognome) {
                    nuoviAtleti.push({
                        id: Date.now() + Math.random(),
                        nome,
                        cognome,
                        dataNascita,
                        sesso,
                        cintura,
                        specialita,
                        peso,
                        societa: nomeSoc
                    });
                }
            });

            if (nuoviAtleti.length === 0) {
                alert("Inserisci almeno un atleta valido con Nome e Cognome!");
                return;
            }

            let societaId = Date.now();
            let datiSocietaCompleti = {
                id: societaId,
                nomeEvento: nomeEvento,
                nome: nomeSoc,
                tecnico: nomeTec,
                email: emailSoc,
                telefono: telSoc,
                logo: logoBase64Temp,
                locandina: locandinaEventoRemota,
                fotoTecnico: fotoTecnicoBase64Temp,
                dataRegistrazione: new Date().toLocaleString()
            };

            database.ref('iscrizioni_pendenti/' + societaId).set({
                societa: datiSocietaCompleti,
                atleti: nuoviAtleti
            }, (error) => {
                if (error) {
                    alert("Errore durante l'invio su Firebase: " + error.message);
                } else {
                    mostraSuccesso();
                }
            });
        }

        function mostraSuccesso() {
            document.getElementById('messaggioStato').innerHTML = `
                <div class="alert alert-success text-center fw-bold py-3">
                    🎉 Iscrizione inviata con successo! Gli atleti sono stati registrati nel torneo.
                </div>
            `;
            setTimeout(() => {
                location.reload();
            }, 3000);
        }
    </script>
</body>
</html>
